<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Commerce project cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <circle cx="900" cy="250" r="180" fill="none" stroke="#d3fd50" stroke-width="2" opacity="0.5"/>
     <circle cx="900" cy="250" r="120" fill="none" stroke="#d3fd50" stroke-width="2" opacity="0.7"/>
     <circle cx="900" cy="250" r="60" fill="#d3fd50" opacity="0.9"/>

  <text x="80" y="700" font-family="Impact, 'Arial Black', sans-serif" font-size="150" fill="#f5f5f5" letter-spacing="-4">COMMERCE</text>
  <text x="80" y="770" font-family="ui-monospace, 'Courier New', monospace" font-size="28" fill="#d3fd50" letter-spacing="8">PROJECT 01</text>
</svg>
