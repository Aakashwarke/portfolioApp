<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Analytics project cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>

  <rect x="760" y="360" width="60" height="180" fill="#d3fd50" opacity="0.35"/>
     <rect x="840" y="280" width="60" height="260" fill="#d3fd50" opacity="0.6"/>
     <rect x="920" y="180" width="60" height="360" fill="#d3fd50"/>
     <rect x="1000" y="320" width="60" height="220" fill="#d3fd50" opacity="0.45"/>

  <text x="80" y="700" font-family="Impact, 'Arial Black', sans-serif" font-size="150" fill="#f5f5f5" letter-spacing="-4">ANALYTICS</text>
  <text x="80" y="770" font-family="ui-monospace, 'Courier New', monospace" font-size="28" fill="#d3fd50" letter-spacing="8">PROJECT 02</text>
</svg>
